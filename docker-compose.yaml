services:

  app:
    build: .
    container_name: url-shortener

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/urlshortener?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    restart: unless-stopped

  mysql:
    image: mysql:8

    container_name: mysql

    environment:
      MYSQL_DATABASE: urlshortener
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 10

    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: redis

    ports:
      - "6379:6379"

    restart: unless-stopped

  prometheus:
    image: prom/prometheus

    container_name: prometheus

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana

    container_name: grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}

    volumes:
      - grafana-storage:/var/lib/grafana
      # Provisioned as code so a fresh clone gets the datasource and dashboard.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

    depends_on:
      - prometheus

volumes:
  grafana-storage:
  mysql-data:
