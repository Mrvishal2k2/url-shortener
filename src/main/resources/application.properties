spring.application.name=shortener
spring.config.import=optional:file:./.env[.properties]
server.port=${APP_PORT:8080}
spring.datasource.url=jdbc:mysql://localhost:3306/urlshortener?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics

spring.jackson.default-property-inclusion=non_null

logging.file.name=app.log
logging.level.root=INFO
logging.level.com.devportal=DEBUG

app.base-url=http://localhost:${server.port}
app.expiry-guest-days=30


