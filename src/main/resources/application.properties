spring.application.name=shortener
spring.config.import=optional:file:./.env[.properties]
server.port=${APP_PORT:8080}
# Local defaults. Docker overrides these with SPRING_DATASOURCE_* env vars.
spring.datasource.url=jdbc:mysql://localhost:3306/urlshortener?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics

spring.jackson.default-property-inclusion=non_null

logging.file.name=app.log
logging.level.root=INFO

app.base-url=${APP_BASE_URL:http://localhost:${server.port}}
app.expiry-guest-days=30


